name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: scripts/check.sh

  # Releasing = changing "version" in manifest.json on main. Once every check
  # above is green, the tag and the GitHub release are created automatically,
  # with the matching CHANGELOG.md section as notes.
  release:
    name: Release
    needs: [hacs, hassfest, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Create the release if this version has none
        run: |
          VERSION=$(jq -r .version custom_components/meter_vision/manifest.json)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released"
            exit 0
          fi
          awk -v v="$VERSION" 'index($0, "## [" v "]")==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "v$VERSION" --title "$VERSION" --target "$GITHUB_SHA" --notes-file notes.md
          else
            gh release create "v$VERSION" --title "$VERSION" --target "$GITHUB_SHA" --generate-notes
          fi
