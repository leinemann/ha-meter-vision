name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

# Least privilege: nothing by default, each job asks for what it needs.
# Actions are pinned to commit SHAs (Dependabot keeps them current).
permissions: {}

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # home-assistant/actions publishes no releases: pinned to master as of 2026-11-18.
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: scripts/check.sh

  # Releasing = changing "version" in manifest.json on main. Once every check
  # above is green, the tag and the GitHub release are created automatically,
  # with the matching CHANGELOG.md section as notes. main only changes through a
  # reviewed pull request, so merging a version bump IS the release decision.
  # The only job allowed to write: it creates the tag and the release.
  release:
    name: Release
    needs: [hacs, hassfest, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release if this version has none
        run: |
          VERSION=$(jq -r .version custom_components/meter_vision/manifest.json)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released"
            exit 0
          fi
          awk -v v="$VERSION" 'index($0, "## [" v "]")==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "v$VERSION" --title "$VERSION" --target "$GITHUB_SHA" --notes-file notes.md
          else
            gh release create "v$VERSION" --title "$VERSION" --target "$GITHUB_SHA" --generate-notes
          fi
