version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Test tooling only: the integration itself has no Python requirements.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
