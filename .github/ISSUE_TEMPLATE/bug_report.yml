name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect and what happened instead?
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Meter Vision version
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Meter type and unit, digits and decimal digits, camera (and light), AI Task integration and model. A frame from the last frame entity helps a lot.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → Meter Vision → ⋮ → Download diagnostics. Attach the file.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines with `custom_components.meter_vision` set to debug.
      render: text
