customElements.define("ha-card", class extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: "open" }).innerHTML = `<style>:host{display:block;background:var(--card-background-color);border-radius:12px;border:1px solid var(--ha-card-border-color);color:var(--primary-text-color)}</style><slot></slot>`;
  }
});
customElements.define("ha-icon", class extends HTMLElement {
  static get observedAttributes() { return ["icon"]; }
  connectedCallback() { this._draw(); }
  attributeChangedCallback() { this._draw(); }
  _draw() {
    const path = ICONS[(this.getAttribute("icon") || "").replace("mdi:", "")] || "";
    this.style.display = "inline-flex";
    this.innerHTML = `<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);fill:currentColor"><path d="${path}"/></svg>`;
  }
});

await import("../custom_components/meter_vision/frontend/meter-vision-card.js?v=demo");

// Demo data: a fictional water meter read every 15 minutes.
const lang = new URLSearchParams(location.search).get("lang") || "en";
const now = Date.now();
const minutes = (m) => new Date(now - m * 60000).toISOString();
const P = "water_meter";
const VALUE = 1256.384;
const demo = {
  [`sensor.${P}_reading`]: ["reading", VALUE, {
    unit_of_measurement: "m³", device_class: "water", state_class: "total_increasing",
    meter_type: "water", digits: 8, decimal_places: 3, pending_value: null,
    camera_entity: "camera.demo_meter", light_entity: "light.demo_flash"
  }],
  [`sensor.${P}_last_result`]: ["last_result", "accepted", {
    digits_read: "01256384", consecutive_failures: 0, ai_engine: "ai_task.demo_vision", last_error: null
  }],
  [`sensor.${P}_confidence`]: ["confidence", 9],
  [`sensor.${P}_last_read`]: ["last_read", minutes(4)],
  [`binary_sensor.${P}_problem`]: ["problem", "off"],
  [`binary_sensor.${P}_reading_in_progress`]: ["reading_in_progress", "off"],
  [`switch.${P}_automatic_reading`]: ["automatic_reading", "on"],
  [`button.${P}_read_now`]: ["read_now", "unknown"],
  [`image.${P}_last_frame`]: ["last_frame", minutes(4), { entity_picture: "demo-frame.jpg" }]
};
const hass = {
  language: lang,
  locale: { language: lang },
  states: {},
  entities: {},
  devices: { demo: { name: lang === "it" ? "Contatore acqua" : "Water meter" } },
  callService: async () => {},
  callApi: async () => {
    // 48 h of fictional readings every 15 minutes: night trickle, morning and evening peaks.
    const rate = (h) => 0.002 + (h >= 6.5 && h < 8.5 ? 0.075 : 0) + (h >= 12 && h < 14 ? 0.03 : 0) +
      (h >= 19 && h < 22 ? 0.055 : 0); // m³ per hour
    const series = [];
    let value = VALUE;
    for (let m = 0; m <= 48 * 60; m += 15) {
      const at = new Date(now - m * 60000);
      series.push({ state: value.toFixed(3), last_changed: at.toISOString() });
      const hour = at.getHours() + at.getMinutes() / 60;
      value -= (rate(hour) * 15) / 60 * (0.8 + 0.4 * Math.abs(Math.sin(m * 1.7)));
    }
    return [series.reverse()];
  }
};
for (const [id, [key, state, attributes]] of Object.entries(demo)) {
  hass.states[id] = { state: String(state), attributes: attributes || {} };
  hass.entities[id] = { entity_id: id, device_id: "demo", platform: "meter_vision", translation_key: key };
}
const Card = customElements.get("meter-vision-card");
for (const pane of document.querySelectorAll(".pane")) {
  const card = document.createElement("meter-vision-card");
  card.setConfig({ type: "custom:meter-vision-card", ...Card.getStubConfig(hass) });
  pane.appendChild(card);
  card.hass = hass;
}
document.body.dataset.ready = "1";
